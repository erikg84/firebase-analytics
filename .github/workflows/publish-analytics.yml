name: Publish Analytics SDK to GitHub Packages

on:
  push:
    tags:
      - 'analytics-v*'

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/analytics-v}" >> $GITHUB_OUTPUT

      - name: Build and publish firebase-analytics
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :firebase-analytics:publishAllPublicationsToGitHubPackagesRepository -Pversion=${{ steps.get_version.outputs.VERSION }}
